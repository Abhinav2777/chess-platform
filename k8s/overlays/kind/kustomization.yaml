# The kind environment: the app (base) + in-cluster dependencies + local configuration.
resources:
  - ../../base
  - ../../deps

namespace: chess

# Generated with a content hash in the name, and every reference rewritten to match: changing a
# value rolls the pods that use it. A hand-written ConfigMap changes underneath running pods and
# nothing restarts.
configMapGenerator:
  - name: chess-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/chess
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=http://elasticmq:9324
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=local   # ElasticMQ ignores them; the SDK wants some
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=local
      - CHESS_MESSAGING_CREATE_QUEUES=true              # ElasticMQ; Terraform owns queues in AWS
      # Memory budget, sized from measurement (Phase 9.3, docs/perf/optimisation-01.md):
      #   heap 50 % of the limit, committed and touched at startup (Initial = Max, AlwaysPreTouch)
      #   + non-heap measured at 212 Mi + native (thread stacks, GC, malloc) ~60–100 Mi.
      # Pre-touching makes the worst-case footprint the everyday one: a budget that cannot hold
      # it fails at deploy (OOMKilled on start), not months later under load. The previous
      # 60 % of 640 Mi did exactly that once the heap was pre-touched — and, without it, was
      # OOM-killed under a stress burst after the heap had grown.
      - JDK_JAVA_OPTIONS=-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=50 -XX:+AlwaysPreTouch -XX:+ExitOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
      # Load-test-sized auth limits (Phase 8.3 registers many users from one address).
      - 'SPRING_APPLICATION_JSON={"chess":{"ratelimit":{"policies":{"login-ip":{"capacity":2000,"period":"1m"},"login-user":{"capacity":100,"period":"1m"},"register-ip":{"capacity":2000,"period":"1m"}}}}}'

# DEVELOPMENT VALUES, committed on purpose: they protect a throwaway local cluster and nothing
# else (the same values as ops/docker/docker-compose.yml). A real environment gets this Secret
# from a secret manager (External Secrets / Sealed Secrets), never from the repository.
secretGenerator:
  - name: chess-secrets
    literals:
      - SPRING_DATASOURCE_USERNAME=chess
      - SPRING_DATASOURCE_PASSWORD=chess
      - CHESS_AUTH_JWT_SECRET=dev-only-insecure-secret-change-me-32-bytes-min
