# Outbox relay + rating consumer (ADR-001, ADR-020). No Service: nothing calls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    chess.dev/gated: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: chess-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: management, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: chess-config }
            - secretRef: { name: chess-secrets }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "k8s,worker" }
            - { name: CHESS_REALTIME_FANOUT, value: valkey }   # it publishes RATING_UPDATED
          resources:
            # Same JVM, same arithmetic as the api (9.3).
            requests: { cpu: 100m, memory: 1Gi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          # The health check ECS could not give the worker (no curl in the image, Phase 7):
          # the kubelet probes HTTP itself.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
