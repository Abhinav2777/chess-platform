apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: elasticmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: elasticmq }
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.7.1   # SQS stand-in (ADR-019)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9324 }]
          readinessProbe:
            tcpSocket: { port: 9324 }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: elasticmq }
spec:
  selector: { app.kubernetes.io/name: elasticmq }
  ports: [{ port: 9324 }]
