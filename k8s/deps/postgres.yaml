apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: { type: Recreate }   # one writer on one volume; never two at once
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine   # the tested major (ADR-023 §7.3)
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_DB, value: chess }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: chess-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: chess-secrets, key: SPRING_DATASOURCE_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, chess, -d, chess] }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 256Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432 }]
