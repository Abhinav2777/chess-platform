# One-node kind cluster for Phase 8 (ADR-024). One node is enough: the subject is pod lifecycle
# — probes, drain, rolling updates — not node scheduling, and every node costs ~0.6 GB here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chess
nodes:
  - role: control-plane
    # Pinned, as kind v0.33.0's release notes publish it — the cluster is the same every time.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"   # ingress-nginx's kind manifest schedules onto this label
    extraPortMappings:
      # ingress-nginx binds port 80 inside the node; the host sees it as http://localhost.
      # 80 → 80, not 8000 → 80: nginx reports the port IT listens on (X-Forwarded-Port: 80), and
      # Tomcat trusts it. With 8000 → 80 the page's own Origin (localhost:8000) looked
      # cross-origin to Spring and the SPA's module script got 403 — a blank page (8.2). The
      # forwarded port must be the port the browser used; behind a real load balancer it is.
      # http://localhost is a secure context for the browser (crypto.randomUUID etc. — ADR-023).
      - containerPort: 80
        hostPort: 80
        protocol: TCP
