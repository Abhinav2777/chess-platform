# Gradle version catalog.
#
# Every version in this file carries the date it was verified against the vendor's own
# documentation. Do not update a version without updating its date. See ADR-011.
#
# VERIFY BEFORE FIRST BUILD:
#   - springBoot: check https://docs.spring.io/spring-boot/system-requirements.html
#     Spring Boot 4.0.x OSS support ends Dec 2026 — 4.1.x is the correct line.
#   - Starter coordinates: Boot 4 modularised the codebase into smaller jars. Generate a
#     throwaway project at https://start.spring.io (Gradle/Kotlin, Java 25, Boot 4.1) and
#     diff its build file against this one. That tool is ground truth; this file is not.

[versions]
# Gradle itself. Not resolvable as a dependency — this entry is the single source of
# truth for the wrapper. The root build's `wrapper` task reads it, and
# `verifyGradleVersion` fails the build if gradle-wrapper.properties has drifted from it.
#
# The floor is set by four constraints (9.7.1 was the first version meeting all of them):
#   - Java 25 as the Gradle daemon JVM requires >= 9.1.0 (Gradle compatibility matrix)
#   - Spring Boot 4.1's plugin requires 8.14+ or 9.x  (non-binding: 8.14 cannot run on 25)
#   - 9.7.0 has a Kotlin DSL regression in Option annotation argument order; Gradle
#     explicitly recommends 9.7.1
#   - 9.3.0 fixed two repository-handling vulnerabilities
# Full reasoning: docs/adr/ADR-011-java-spring-gradle.md
gradle               = "9.8.0"    # verified 2026-09-30 (current stable, released 2026-09-24)

springBoot           = "4.1.1"    # verified 2026-09-06 — CONFIRM LATEST PATCH
springDepMgmt        = "1.1.7"
java                 = "25"

# chesslib is NOT on Maven Central under this coordinate — it is distributed via
# JitPack, per the project's own README. The groupId `com.github.<user>` is the JitPack
# naming convention and is the tell. See the scoped repository in backend/build.gradle.kts.
# Licence is Apache 2.0 (an earlier note in this repo said MIT — that was also wrong).
chesslib             = "1.3.7"    # verified 2026-09-06 against the project README
logstashEncoder      = "9.0"      # verified 2026-09-30: 9.x is on Jackson 3, the line Boot 4 uses; 8.x dragged Jackson 2 in
springCloudAws       = "4.2.0"    # Spring Cloud AWS 4.x = the Boot 4 line (3.x is Boot 3.5). Tested upstream on Boot 4.0.8.
awsSdk               = "2.55.11"   # BOM, imported after Spring Cloud AWS's so the SDK version is ours (ADR-020).

# JDBC spans for Micrometer Observation (Phase 9). Not Boot-managed; 2.3.0 is built against
# Boot 4.1.1 (its POM), verified 2026-10-01.
datasourceMicrometer = "2.3.0"

archunit             = "1.5.1"
# Testcontainers and AssertJ are deliberately absent: the Spring Boot BOM manages both
# (4.1.1: Testcontainers 2.0.5, AssertJ 3.27.7). Pinning them here fought the BOM — the
# old 1.20.4 BOM left junit-jupiter/postgresql on 1.x while Boot lifted core to 2.0.5, a
# mixed classpath; the AssertJ pin silently DOWNGRADED Boot's version. Found 2026-09-30
# while triaging Dependabot. Rule: pin only what Boot does not manage.

[libraries]
# --- Spring starters (managed by the Boot BOM; no versions here) ---
#
# Boot 4 naming convention: module `spring-boot-<tech>`, root package
# `org.springframework.boot.<tech>`, starter `spring-boot-starter-<tech>`, and a test
# companion `spring-boot-starter-<tech>-test`.
#
# Two traps, both of which this project has now hit or nearly hit:
#   1. A raw third-party coordinate (flyway-core) resolves and compiles but carries no
#      auto-configuration. Silent no-op. Always prefer the starter.
#   2. Renamed starters still resolve as deprecated aliases, so a stale name compiles
#      fine and gives no signal that it is wrong.
#
# `spring-boot-starter-web` is the deprecated alias for `-webmvc`.
spring-web           = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-websocket     = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-jpa           = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-redis         = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-security      = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-validation    = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-actuator      = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# JWT encode/decode. A Spring Security artifact (version managed by the Boot BOM), not a
# Boot starter, so the Boot 4 starter renames do not apply to it.
#
# Deliberately NOT spring-boot-starter-security-oauth2-resource-server: that brings the
# whole resource-server DSL to model an OAuth2 relationship we do not have (we issue our
# own tokens), and Phase 2 needs JwtService callable outside any servlet filter chain for
# WebSocket first-message auth anyway. This artifact is just JwtEncoder/JwtDecoder over
# Nimbus — the crypto, none of the framework.
spring-security-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
# Test companions. Not optional in Boot 4: the test infrastructure for a technology now
# ships in its own starter, so the annotation exists on the classpath but its supporting
# auto-configuration does not.
#   - @WebMvcTest / @AutoConfigureMockMvc moved to o.s.boot.webmvc.test.autoconfigure
#     and need spring-boot-starter-webmvc-test.
#   - @WithMockUser / @WithUserDetails need spring-boot-starter-security-test to work
#     properly, even though the annotations come from spring-security-test.
# Both are used heavily from Milestone 1.2 onward.
#
# spring-boot-starter-test is technically redundant (every test starter brings it
# transitively) but kept explicit: it is what the unit-test suite actually depends on,
# and an implicit transitive dependency is a fragile thing to build a test suite on.
spring-test          = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-webmvc-test   = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }

# --- Persistence ---
# MUST be the starter, not org.flywaydb:flyway-core.
#
# Spring Boot 4 modularised auto-configuration into per-technology jars. FlywayAutoConfiguration
# now lives in `spring-boot-flyway`, which raw `flyway-core` does not pull in. The result is the
# worst kind of failure: Flyway is on the classpath, `spring.flyway.*` properties are accepted,
# the application starts cleanly — and no migration ever runs. It surfaces later and elsewhere,
# as "missing table" from Hibernate schema validation.
#
# This applies to every dependency that used to be auto-configured from a raw coordinate.
flyway-starter       = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-postgres      = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql           = { module = "org.postgresql:postgresql" }

# --- Observability ---
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# Tracing (Phase 9, ADR-026): Micrometer Observation -> OpenTelemetry bridge -> OTLP. Boot-managed.
spring-opentelemetry  = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
datasource-micrometer = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot", version.ref = "datasourceMicrometer" }
otel-sdk-testing      = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
logstash-encoder      = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }

# --- Domain ---
chesslib             = { module = "com.github.bhlangonijr:chesslib", version.ref = "chesslib" }

# --- Test ---
archunit             = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj              = { module = "org.assertj:assertj-core" }
aws-bom                  = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
spring-cloud-aws-bom     = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "springCloudAws" }
spring-cloud-aws-sqs     = { module = "io.awspring.cloud:spring-cloud-aws-starter-sqs" }
# Testcontainers 2.0 renamed every module with a `testcontainers-` prefix; the 1.x names
# are not published for 2.x, which is why Dependabot's BOM-only bump could not resolve.
testcontainers-junit     = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgres  = { module = "org.testcontainers:testcontainers-postgresql" }

[bundles]
observability = ["micrometer-prometheus", "logstash-encoder"]

[plugins]
springBoot    = { id = "org.springframework.boot", version.ref = "springBoot" }
springDepMgmt = { id = "io.spring.dependency-management", version.ref = "springDepMgmt" }
