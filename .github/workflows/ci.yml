name: CI

# Every PR, and every push to main. A PR must be green in all three jobs before it can merge
# (branch protection); a push to main additionally publishes the image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Without this, a busy branch
# queues builds for commits nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: read the code, nothing else. The image job widens this for
# itself only, and only uses it on main.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, not tags. A tag can be moved to point at different
# code, and an action runs with this workflow's token — the tj-actions/changed-files
# compromise (2025) worked exactly that way. Dependabot keeps the SHAs current.

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle-wrapper.jar is a committed binary that executes on every build. Checksummed
      # against Gradle's published releases before anything Gradle-related runs.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only main writes the shared cache; PR branches read it but cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Cheap, fails fast: the wrapper and libs.versions.toml must agree.
      - name: Verify pinned Gradle version
        run: ./gradlew verifyGradleVersion

      # Separate steps so the failure is legible at a glance: red "Unit" is a logic bug,
      # red "Integration" is often environmental. Debugging starts in a different place.
      - name: Unit tests and architecture rules
        run: ./gradlew :backend:test --stacktrace

      - name: Integration tests (Testcontainers)
        run: ./gradlew :backend:integrationTest --stacktrace

      - name: Upload test reports
        if: always()   # the reports matter most when the build failed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci`, not `npm install`: installs exactly the lockfile, fails if it disagrees
      # with package.json.
      - run: npm ci
      # tsc -b then vite build. The dev server never type-checks — which is how a broken
      # production build survived two milestones in Phase 2 (DEVELOPMENT_LOG, 3.2).
      - run: npm run build

  # Infrastructure code gets the same gate as application code (Phase 7.2). No AWS access:
  # init without a backend, so a PR — including a fork's — can check formatting and validity
  # but never read state or plan against the account. Plans stay a human step (DEPLOYMENT.md).
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        stack: [bootstrap, app]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -diff
      # -lockfile=readonly: the committed .terraform.lock.hcl must already match, so CI never
      # silently accepts a provider nobody reviewed.
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # GHCR push; used only on main (see the push step's condition)
      id-token: write   # the OIDC token AWS trades for ECR push credentials (Phase 7.2)
    steps:
      # Image names must be lowercase and the owner is "Abhinav2777". metadata-action
      # lowercases its tags on its own, so the first CI run built ghcr.io/abhinav2777/… and
      # then asked Trivy to scan ghcr.io/Abhinav2777/… — an unparseable name, exit 1.
      # GitHub expressions have no lower(); bash does. Every later step uses this one value.
      #
      # OS_PATCH_DATE busts the Dockerfile's apt-get upgrade layer once a day (see there). Set
      # once, so the Build and Push steps below pass the same value and Push reuses the cache.
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chess-platform" >> "$GITHUB_ENV"
          echo "OS_PATCH_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: the full commit SHA (immutable — what Phase 7 deploys) and `main` (moving).
      # PR builds are tagged too but never pushed.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      # Build and load into the runner's Docker, so the scan sees exactly what would ship.
      # The GitHub Actions cache holds the layers — including the ~88 MB dependency layer
      # that a code-only change reuses (ADR-021).
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          build-args: OS_PATCH_DATE=${{ env.OS_PATCH_DATE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate. Fails on HIGH/CRITICAL vulnerabilities that have a fix available: an
      # unfixable one is not actionable by us, and blocking on it would teach everyone to
      # ignore the scan. The first local scan found 3 CRITICAL in Boot-managed Tomcat.
      - name: Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Only main publishes. Pull requests — including from forks — never get registry
      # credentials, and nothing unreviewed reaches the registry.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ECR (Phase 7.2, infra/bootstrap): what ECS pulls from. No stored AWS key — the job's
      # OIDC token is exchanged for one-hour credentials of a role that only this repository's
      # main branch can assume, and that can only push to one repository. Skipped when the
      # variable is unset (forks; any clone before its bootstrap stack exists).
      - name: AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_ECR_PUSH_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        if: github.ref == 'refs/heads/main' && vars.AWS_ECR_PUSH_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ECR tags are immutable (infra/bootstrap/ecr.tf), so it gets the commit SHA only — never
      # the moving `main`, which an immutable repository would refuse the second time.
      - name: ECR tag
        if: steps.ecr.outputs.registry != ''
        run: echo "ECR_TAG=${{ steps.ecr.outputs.registry }}/chess-platform:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Same inputs, same cache: this "build" is seconds, and pushes the scanned layers.
      # provenance: false — a plain image manifest, no attestation manifests beside it. ECR's
      # lifecycle policy counts and expires manifests; attestations are untagged children it
      # could expire out from under a kept image.
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          build-args: OS_PATCH_DATE=${{ env.OS_PATCH_DATE }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.ECR_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
