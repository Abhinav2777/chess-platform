# Local development dependencies. The application itself runs on the host during
# Phases 0-5 (faster restarts, working debugger). It gets containerised in Phase 6.
#
# Run from the repo root:
#   docker compose -f ops/docker/docker-compose.yml up -d

name: chess-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-postgres
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess   # local only; production creds come from Secrets Manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true before the database accepts connections on the
      # first boot, which produces a flaky "connection refused" on app startup.
      # Running an actual query is the honest check.
      test: ["CMD-SHELL", "psql -U chess -d chess -c 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: chess-valkey
    ports:
      - "6379:6379"
    # No persistence locally, deliberately. Valkey holds nothing that cannot be rebuilt
    # from PostgreSQL (ADR-004), and a cache that survives `docker compose down` would
    # let us accidentally depend on that. Losing it on every restart keeps us honest.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQS stand-in for local development (Phase 5). ElasticMQ rather than LocalStack: since
  # March 2026 the LocalStack image needs an account and auth token, and SQS is the only AWS
  # service this project emulates before Phase 7. Queues are created by the app on first use.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: chess-elasticmq
    ports:
      - "9324:9324"   # SQS API
      - "9325:9325"   # web UI: queue depths, including the dead-letter queue

  # ---------------------------------------------------------------------------------------
  # The application itself, from the image (Phase 6). Off by default so that
  # `docker compose up -d` still starts only the dependencies for bootRun development.
  #   docker compose -f ops/docker/docker-compose.yml --profile app up -d --build
  # Same order as a real deploy: migrate runs and exits 0, then API and worker start.
  # Stop any bootRun on :8080 first.
  # ---------------------------------------------------------------------------------------
  # Traces + metrics, locally (Phase 9, ADR-026): Grafana, Tempo, Prometheus and an
  # OpenTelemetry collector in one container. Opt-in: --profile observability.
  # Grafana http://localhost:3000 (admin/admin). OTLP http://localhost:4318.
  # Point the app at it with
  #   MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://localhost:4318/v1/traces
  #   MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true
  #   MANAGEMENT_OTLP_METRICS_EXPORT_URL=http://localhost:4318/v1/metrics
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    container_name: chess-lgtm
    profiles: ["observability"]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  migrate:
    profiles: ["app"]
    image: chess-platform:dev
    build: { context: ../.., dockerfile: backend/Dockerfile }
    environment: &app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chess
      SPRING_DATASOURCE_USERNAME: chess
      SPRING_DATASOURCE_PASSWORD: chess          # local only — Secrets Manager in AWS
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://elasticmq:9324
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: local
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: local
      CHESS_MESSAGING_CREATE_QUEUES: "true"      # ElasticMQ; Terraform owns queues in AWS
      # Two processes now: the worker's rating pushes must reach sockets held by the API.
      CHESS_REALTIME_FANOUT: valkey
      CHESS_AUTH_JWT_SECRET: dev-only-insecure-secret-change-me-32-bytes-min
      # Development-sized auth limits (as application-local.yml): browser checks and Postman
      # register and log in many users from one IP. Production limits (5 registrations/min)
      # refused the third browser-check user — the limiter working, the stack mis-sized.
      # JSON because map keys with dashes (register-ip) cannot be spelled as env var names.
      SPRING_APPLICATION_JSON: >-
        {"chess":{"ratelimit":{"policies":{
          "login-ip":{"capacity":200,"period":"1m"},
          "login-user":{"capacity":100,"period":"1m"},
          "register-ip":{"capacity":100,"period":"1m"}}}}}
      SPRING_PROFILES_ACTIVE: migrate
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    image: chess-platform:dev
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: ""
    ports:
      - "8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  worker:
    profiles: ["app"]
    image: chess-platform:dev
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      elasticmq: { condition: service_started }

volumes:
  postgres-data:
