# Local development profile. Matches ops/docker/docker-compose.yml.
# These credentials are intentionally weak and intentionally committed — they grant
# access to a throwaway container. Production credentials come from AWS Secrets Manager
# and never appear in this repository.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chess
    username: chess
    password: chess
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  jpa:
    show-sql: false            # use the SQL logger below instead; show-sql bypasses logging config

# SQL logging is opt-in. It used to be on by default, and the timeout sweeper's
# once-a-second query buried everything else (~100k tokens of log in a few minutes).
# Bind logging also printed parameter values — password and refresh-token hashes
# included — which is not something to have on by habit, even locally. When you need it:
#   ./gradlew :backend:bootRun --args='--spring.profiles.active=local \
#       --logging.level.org.hibernate.SQL=DEBUG --logging.level.org.hibernate.orm.jdbc.bind=TRACE'
logging:
  level:
    org.hibernate.SQL: INFO

# Rate limits sized for development: Postman, the browser checks and manual play all log in
# from 127.0.0.1 many times a minute. The production-shaped values in application.yml are
# exercised by RateLimitIntegrationTest instead.
chess:
  ratelimit:
    policies:
      login-ip:    { capacity: 200, period: 1m }
      login-user:  { capacity: 100, period: 1m }
      register-ip: { capacity: 100, period: 1m }
