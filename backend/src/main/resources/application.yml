spring:
  application:
    name: chess-platform
  main:
    # The banner is printed to stdout, outside Logback: seven lines of ASCII art in an
    # otherwise one-JSON-object-per-line stream, which CloudWatch Insights would ingest as
    # seven unparseable events per start.
    banner-mode: off

  # Spring Cloud AWS (ADR-020). In AWS the region and credentials come from the task's
  # environment and role; nothing secret is configured here. The static region only stops
  # the client from probing instance metadata on a developer machine.
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        # Listener containers must never create a queue: it would have no dead-letter policy.
        # Queues come from SqsQueues (ElasticMQ) or Terraform (AWS). ADR-020.
        queue-not-found-strategy: fail
        # Producer and consumer observations: the listener continues the trace carried in the
        # message's `traceparent` attribute (the relay sets it from the outbox row — ADR-026).
        observation-enabled: true

  # Authentication is JWT-only (SecurityConfig: stateless, httpBasic and formLogin off),
  # so Boot's default in-memory user — one account, random password printed at startup —
  # has no route in. Excluded anyway: an unused credential store is attack surface and a
  # startup warning that trains people to ignore startup warnings. A misspelt class name
  # here fails startup, so this cannot silently stop applying.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # Virtual threads. Tomcat serves each request on a virtual thread, so blocking JDBC
  # costs a platform thread only while it is actually executing. This is what makes
  # thread-per-request viable at high connection counts and why we do not need WebFlux
  # (ADR-011).
  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      # The connection pool is the expected first bottleneck (ARCHITECTURE.md §14), so
      # these numbers are deliberate rather than defaults.
      #
      # 10 is not "small". A pool larger than the database can serve turns connection
      # starvation into database thrashing, which is harder to diagnose. RDS
      # db.t4g.micro allows roughly 85 connections total, so pods x pool-size is the
      # real ceiling. Measure in Phase 9 before changing this.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000   # fail fast; a 30s stall looks like a hang, not an error
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    # Hibernate NEVER manages the schema. Flyway owns it, in every environment, always.
    # `ddl-auto: validate` means the app refuses to start if entities and migrations
    # have drifted apart — which is exactly the failure you want at boot rather than at
    # 3am on a query.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Map java.time.Instant to TIMESTAMP WITH TIME ZONE.
        #
        # Hibernate's default for Instant is plain TIMESTAMP (no zone). Every timestamp
        # column in this schema is TIMESTAMPTZ, so without this, `ddl-auto: validate`
        # rejects every entity with an Instant field:
        #
        #   wrong column type encountered in column [created_at] in table [users];
        #   found [timestamptz (Types#TIMESTAMP_WITH_TIMEZONE)],
        #   but expecting [timestamp(6) (Types#TIMESTAMP)]
        #
        # The alternatives are worse. Changing the columns to TIMESTAMP would discard
        # the offset and make "when did this happen" depend on the server's zone —
        # unacceptable for a system whose clock decides game outcomes (ADR-006).
        # Annotating each field with @JdbcTypeCode(SqlTypes.TIMESTAMP_UTC) works but
        # must be remembered on every future timestamp, and being forgotten once is a
        # startup failure. One global setting, correct by default.
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC
        jdbc:
          # Belt-and-braces: forces UTC on the JDBC driver for any type that still goes
          # through a zoneless path. With TIMESTAMP_UTC above this is mostly redundant,
          # but it costs nothing and removes a whole class of "works on my laptop,
          # shifts by 5:30 in CI" bug.
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      # Fail fast, always. Valkey is a cache and a transport, never the source of truth
      # (ADR-004), so a request must never block on it for meaningful time. With the
      # default multi-second timeouts, a Valkey outage would turn every presence lookup
      # into a stall and convert a degraded feature into a degraded application.
      timeout: 1s
      connect-timeout: 500ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # an empty database should run V1, not be baselined past it

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always     # local and tests only: the aws profile says never, on port 8081
      # Readiness vs liveness are different questions (ADR-024).
      # Liveness = "is the JVM alive": livenessState only, never a dependency — otherwise the
      # orchestrator restarts healthy processes because the database blipped.
      # Readiness = "send me traffic":
      #   readinessState — the application's own verdict; SocketDrain sets it to
      #     REFUSING_TRAFFIC on shutdown. Listing a group's members REPLACES the default, so
      #     until 8.2 this was missing and the drain never reached the probe.
      #   db — without PostgreSQL nothing can be served.
      #   NOT redis — the app keeps games going without Valkey (ADR-018). With it here, a Valkey
      #     outage made every instance unready at once and the load balancer answered 503 to
      #     everything: a degraded feature turned into a total outage.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  # Tracing (Phase 9, ADR-026). Spans are produced always; they are EXPORTED only when an
  # OTLP endpoint is configured (MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, e.g.
  # http://lgtm:4318/v1/traces) — Boot 4 creates no exporter without one, so tests and CI stay
  # quiet. Sampling 100 % by default: portfolio-scale traffic; a busy production would lower it
  # (and sample by parent, which is the default sampler, so a trace is kept or dropped whole).
  tracing:
    sampling:
      probability: ${CHESS_TRACING_SAMPLING:1.0}
  otlp:
    metrics:
      export:
        # On by default in Boot, pushing to localhost:4318 every minute and logging the failure
        # where no collector runs. Metrics are scraped from /actuator/prometheus; the local
        # Grafana stack turns this on explicitly (MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED).
        enabled: false
  metrics:
    distribution:
      # Histograms, not just averages, for the latencies Phase 9 measures: a mean hides the
      # tail that players feel.
      percentiles-histogram:
        chess.ws.message: true
        http.server.requests: true
    tags:
      application: chess-platform
  observations:
    key-values:
      application: chess-platform

chess:
  auth:
    # Development default ONLY. Overridden by CHESS_AUTH_JWT_SECRET in every other
    # environment, sourced from AWS Secrets Manager (ADR-010). Committing a real signing
    # key would let anyone who reads this repository mint valid tokens for production.
    jwt-secret: ${CHESS_AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-32-bytes-min}

    # 15 minutes. Access tokens cannot be revoked (ADR-009), so this duration IS the
    # exposure window for a stolen one. Short enough to bound the damage, long enough
    # that refreshes are not constant.
    access-token-ttl: 15m

    # 14 days. How long a user stays signed in without re-entering a password. Safe to
    # make this long because the token is single-use and rotates: a stolen one stops
    # working the moment either party refreshes, and reuse revokes the whole family.
    refresh-token-ttl: 14d

    # The refresh cookie's Secure flag. Stays true everywhere except a deployment served
    # over plain HTTP (browsers drop Secure cookies there), which sets
    # CHESS_AUTH_REFRESH_COOKIE_SECURE=false and gets a startup WARN for it (ADR-023).
    refresh-cookie-secure: true

    # The password-hashing pool (BoundedPasswordEncoder, Phase 9.4). bcrypt runs on these
    # platform threads, never on a request's virtual thread: on one carrier (a fractional-vCPU
    # task) a hash there stops every other request on the instance. 0 threads = one per processor.
    # The queue is the latency budget (worst wait ~ capacity x hash time / threads); a full queue
    # answers 503 with Retry-After instead of making callers wait longer than they will.
    hashing:
      threads: 0
      queue-capacity: 16

  realtime:
    # How long a socket may stay open without authenticating. The pre-auth window is
    # unavoidable — the browser cannot set handshake headers (ADR-009) — so it is bounded
    # instead. Five seconds is generous for a client that already holds its token.
    auth-timeout: 5s

    # Cap on concurrent unauthenticated sockets. Without it, opening connections and never
    # sending AUTH consumes file descriptors for free.
    max-unauthenticated: 100

    # Per-socket outbound buffer before the connection is closed. A client that stops
    # reading must not make the server buffer without limit — that is how one phone that
    # lost signal becomes an out-of-memory error. 512 KB is far more than a chess game
    # generates; it exists to catch pathology, not normal traffic.
    send-buffer-bytes: 524288

    # How long a single write may block before the session is abandoned.
    send-timeout: 5s

    # How events reach subscribers.
    #   local  - in-JVM. Correct for exactly one instance. Two instances behind a load
    #            balancer will silently desynchronise games, because the two players
    #            frequently connect to different ones.
    #   valkey - cross-instance pub/sub (Milestone 2.2).
    fanout: local

    # Origins permitted to open a socket. Overridden per environment.
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  # Largest HTTP request body (RequestBodyLimitFilter, 10.1). A registration is a few hundred
  # bytes; nothing else bounds a JSON body, and Spring parses it before the controller (and its
  # rate limit) runs. Over the limit: 413.
  http:
    max-request-body: 16KB

  # Asynchronous events (Phase 5, ADR-008). The outbox is written in the game transaction;
  # the relay moves it to SQS. The relay runs only in the worker role (ADR-001).
  messaging:
    relay-enabled: false
    queue: game-events
    dead-letter-queue: game-events-dlq
    max-receive-count: 3
    create-queues: false
    relay-batch-size: 50
    visibility-timeout: 30s

  # The rating consumer (Phase 5.2). Worker role only, like the relay (ADR-001).
  rating:
    consumer-enabled: false
    max-concurrent-messages: 5

  # One circuit for every degradable Valkey call on this instance (ValkeyGuard): after a
  # failure, nothing asks Valkey for this long, so an outage costs one timeout per window
  # rather than one per request.
  valkey:
    circuit-open-for: 5s
    # Once per connection: TCP + TLS handshake + HELLO. Separate from spring.data.redis.timeout
    # (per command, 1 s): a cold JVM on 0.25 vCPU took over a second for its first TLS handshake
    # to ElastiCache, and the shared budget killed every task at startup (ValkeyClientConfig).
    connection-init-timeout: 10s

  # Matchmaking (ADR-016). The queue lives in Valkey; pairing is a Lua script.
  matchmaking:
    # Rating difference accepted at once, growth per second waited, and the cap. At these
    # values a 200-point gap is accepted after 10 s and the 400 cap is reached after 30 s.
    base-window: 100
    window-growth: 10
    max-window: 400
    # The client re-seeks every 15 s while waiting. Three missed re-seeks = gone.
    seek-ttl: 45s
    # Claim-to-commit budget for creating the game. Far above normal (milliseconds);
    # bounds how long an instance crash can hold two players out of the queue.
    pending-ttl: 30s
    # How long an unseen match is re-announced on reconnect.
    match-ttl: 60s
    scan-limit: 50
    neighbours: 5
    pairs-per-tick: 50

  # Rate limits (Milestone 4.2, ARCHITECTURE.md §11). Token buckets in Valkey: `capacity`
  # at once, refilling at `capacity` per `period`. Fail open when Valkey is unreachable.
  ratelimit:
    enabled: true
    policies:
      login-ip:    { capacity: 10, period: 1m }
      login-user:  { capacity: 5,  period: 1m }
      register-ip: { capacity: 5,  period: 1m }
      # Humans cannot sustain 20 moves a second; a script can. Burst-tolerant for premoves.
      move:        { capacity: 20, period: 1s }
      # The client re-seeks every 15 s; ten in 30 s leaves room for clicks and reconnects.
      seek:        { capacity: 10, period: 30s }

server:
  shutdown: graceful           # drain in-flight requests on SIGTERM (matters in Phase 8)
  servlet:
    context-parameters:
      # Largest inbound WebSocket text frame; bigger ones close the socket with 1009. Tomcat's
      # default, written down (10.1): it was the only thing bounding frames, and a default
      # nobody chose can change under an upgrade. The largest real frame (MOVE) is ~250 bytes.
      org.apache.tomcat.websocket.textBufferSize: 8192
      org.apache.tomcat.websocket.binaryBufferSize: 8192
  error:
    include-message: never     # never leak exception messages to clients
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.chessplatform: DEBUG
