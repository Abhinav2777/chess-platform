# Deployed on AWS behind the ALB (Phase 7, ADR-023). Combined with the role:
#   api     SPRING_PROFILES_ACTIVE=aws
#   worker  SPRING_PROFILES_ACTIVE=aws,worker
#   migrate SPRING_PROFILES_ACTIVE=aws,migrate
# Holds what is true of any AWS deployment. Per-environment values (endpoints, secrets, the
# cookie flag) come from the task definition's environment instead.

server:
  # The ALB terminates the client connection, so getRemoteAddr() is the ALB's address — and
  # every per-IP rate limit (login, register) would be one bucket shared by all users.
  # "native" lets Tomcat's RemoteIpValve replace it from X-Forwarded-For, but only when the
  # connection comes from a trusted proxy, and it takes the right-most untrusted entry: the
  # address the ALB itself appended. A client-supplied X-Forwarded-For cannot pick a bucket.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Trust only the VPC (10.0.0.0/16, infra/app). Tomcat's default also trusts every other
      # private range; narrower is better. Must change if the VPC CIDR does.
      internal-proxies: '10\.0\.\d{1,3}\.\d{1,3}'

management:
  # Actuator on its own port. The ALB forwards only 8080, so nothing under /actuator is
  # reachable from outside the VPC: not the health details, and not /actuator/prometheus,
  # which on 8080 any signed-in player could read. The ALB health-checks 8081 directly; metrics
  # scraping (Phase 9) will too, from inside the VPC.
  server:
    port: 8081
  endpoint:
    health:
      # Status only. The ALB needs the HTTP code; nobody outside needs to learn the database
      # product or the Valkey version.
      show-details: never

chess:
  auth:
    # No default here (10.1). application.yml's development fallback is a key published in this
    # repository: a task started without CHESS_AUTH_JWT_SECRET — a renamed or dropped secret
    # mapping — would sign tokens anyone can mint. Unresolvable placeholder = startup fails.
    jwt-secret: ${CHESS_AUTH_JWT_SECRET}
